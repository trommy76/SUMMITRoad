services:
  summitroad:
    image: ghcr.io/trommy76/summitroad-server:latest
    container_name: summitroad
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Creates this user on first start (ignored if the user already exists).
      SUMMITROAD_USER: "admin"
      SUMMITROAD_PASSWORD: "change-me"
      # Set to "1" when Cloudflare / a reverse proxy sits in front, so login throttling sees the real client IP.
      SUMMITROAD_TRUST_PROXY: "1"
      # Locked out of two-factor? Uncomment, redeploy, sign in with just your password (and your Mac app can use its
      # normal password again), fix things in Settings, then remove this line again. Nobody's 2FA setup is deleted.
      # SUMMITROAD_DISABLE_MFA: "1"
    volumes:
      - summitroad-data:/data

volumes:
  summitroad-data:
