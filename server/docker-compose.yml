services:
  summitroad:
    image: ghcr.io/trommy76/summitroad-server:latest
    container_name: summitroad
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Creates this user on first start (ignored if the user already exists).
      SUMMITROAD_USER: "admin"
      SUMMITROAD_PASSWORD: "change-me"
    volumes:
      - summitroad-data:/data

volumes:
  summitroad-data:
