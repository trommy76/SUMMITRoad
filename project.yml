name: SummitRoad
options:
  bundleIdPrefix: com.trommy76
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.37
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  SummitRoad:
    type: application
    platform: iOS
    configFiles:
      Debug: ios/Signing.xcconfig
      Release: ios/Signing.xcconfig
    sources:
      - path: Sources/SummitTrainer
      - path: ios/Assets.xcassets
      - path: Resources/Backgrounds
        type: folder
    postBuildScripts:
      - name: Set version from VERSION
        inputFiles:
          - $(SRCROOT)/VERSION
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(DERIVED_FILE_DIR)/version.stamp
        script: |
          V=$(tr -d '[:space:]' < "${SRCROOT}/VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" -c "Set :CFBundleVersion $V" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          touch "${DERIVED_FILE_DIR}/version.stamp"
    settings:
      base:
        PRODUCT_NAME: SummitRoad
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/Info.plist
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: SummitRoad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: SummitRoad connects to your smart trainer and heart-rate monitor over Bluetooth.
        NSCameraUsageDescription: SummitRoad uses the camera only to scan the QR code that connects the app to your home server.
        NSLocalNetworkUsageDescription: SummitRoad syncs your rides and plan with your own home server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false
        CFBundleURLTypes:
          - CFBundleURLName: com.trommy76.summitroad.connect
            CFBundleURLSchemes:
              - summitroad
